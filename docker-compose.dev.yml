services:
  postgres:
    image: postgres:15-alpine
    container_name: script-monitor-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: script_monitor
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  app:
    build:
      context: .
      target: builder  # Используем builder stage для разработки
    container_name: script-monitor-app-dev
    environment:
      SERVER_CREATE_PORT: 8080
      SERVER_CALLBACK_PORT: 8081
      SERVER_READ_TIMEOUT: 10s
      SERVER_WRITE_TIMEOUT: 10s
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: script_monitor
      DB_SSLMODE: disable
      DB_MAX_CONN: 10
      SSH_TIMEOUT: 30s
      SSH_PORT: 22
      CALLBACK_TOKEN: secret
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - .:/app  # Монтируем код для горячей перезагрузки
    command: go run cmd/server/main.go
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge